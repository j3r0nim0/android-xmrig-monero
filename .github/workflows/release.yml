name: Publish release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  build-xmrig:
    name: Build XMRig binary (NDK cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      binary-hash: ${{ steps.hash.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK with NDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake make perl build-essential

      - name: Build XMRig from source
        run: |
          set -euo pipefail
          HOSTTAG=linux-x86_64
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          SR="$PWD/sysroot"
          NCPU=$(nproc)

          git clone --depth 1 --branch v6.25.0-mo1 \
            https://github.com/MoneroOcean/xmrig.git
          git clone --depth 1 https://github.com/libuv/libuv.git
          git clone --depth 1 --branch openssl-3.4 \
            https://github.com/openssl/openssl.git

          # 1) libuv → static (platform 28, policy flag)
          cmake -S libuv -B libuv-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLIBUV_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build libuv-build -j"$NCPU"
          cmake --install libuv-build --prefix "$SR"

          # 2) OpenSSL → static
          ( cd openssl
            export ANDROID_NDK_ROOT=$NDK
            export PATH=$NDK/toolchains/llvm/prebuilt/$HOSTTAG/bin:$PATH
            ./Configure android-arm64 -D__ANDROID_API__=28 \
              no-shared no-tests no-docs --prefix="$SR"
            make -j"$NCPU" && make install_sw )

          # 3) pthread/rt stubs (NDK 28)
          mkdir -p stublibs
          "$NDK/toolchains/llvm/prebuilt/$HOSTTAG/bin/llvm-ar" crs stublibs/libpthread.a
          "$NDK/toolchains/llvm/prebuilt/$HOSTTAG/bin/llvm-ar" crs stublibs/librt.a

          # 4) XMRig (TLS on)
          cmake -S xmrig -B xmrig-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28 \
            -DCMAKE_BUILD_TYPE=Release -DWITH_TLS=ON \
            -DOPENSSL_ROOT_DIR="$SR" \
            -DOPENSSL_SSL_LIBRARY="$SR/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$SR/lib/libcrypto.a" \
            -DOPENSSL_INCLUDE_DIR="$SR/include" \
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_NVML=OFF \
            -DWITH_HWLOC=OFF \
            -DUV_LIBRARY="$SR/lib/libuv.a" -DUV_INCLUDE_DIR="$SR/include" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PWD/stublibs"
          cmake --build xmrig-build -j"$NCPU"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp xmrig-build/xmrig app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Verify TLS is linked
        run: |
          strings app/src/main/jniLibs/arm64-v8a/libxmrig.so | grep -iE 'OpenSSL 3'

      - name: Hash binary
        id: hash
        run: |
          sha256sum app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: libxmrig
          path: app/src/main/jniLibs/arm64-v8a/libxmrig.so

  build-apk:
    name: Build and attest APK
    needs: build-xmrig
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore XMRig binary
        uses: actions/download-artifact@v4
        with:
          name: libxmrig
          path: app/src/main/jniLibs/arm64-v8a/

      - name: Verify binary artifact
        run: |
          ls -lh app/src/main/jniLibs/arm64-v8a/libxmrig.so
          file app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-xmrig-monero-${{ github.ref_name }}.apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk